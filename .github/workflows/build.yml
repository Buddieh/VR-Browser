name: build

on:
  push:
    branches: [claude/project-thread-g1s0zv, main]
    paths: ["player/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-arm64:
    # Native arm64 runner: Ubuntu 24.04 has glibc 2.39, same as SteamOS on the Frame.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential pkg-config \
            libvulkan-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-glx0-dev \
            libxrandr-dev libxxf86vm-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: player
        run: cargo build --release --locked || cargo build --release

      - name: Package
        run: |
          mkdir -p dist/vr-player
          cp player/target/release/vr-player dist/vr-player/
          cp scripts/vr-player-launcher.sh dist/vr-player/
          echo "${GITHUB_SHA}" > dist/vr-player/VERSION
          tar -C dist -czf vr-player-linux-arm64.tar.gz vr-player
          sha256sum vr-player-linux-arm64.tar.gz > vr-player-linux-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: vr-player-linux-arm64
          path: vr-player-linux-arm64.tar.gz*

      - name: Publish "nightly" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly vr-player-linux-arm64.tar.gz vr-player-linux-arm64.tar.gz.sha256 \
            --prerelease --target "${GITHUB_SHA}" --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Latest build of the VR player for Steam Frame. Install or update with scripts/install.sh."
